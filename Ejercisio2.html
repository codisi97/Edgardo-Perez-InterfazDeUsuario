<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercisio 2</title>
</head>
<body>
  <div role="tablist" aria-label="Opciones de vista">
    <button role="tab" aria-selected="true">Inicio</button>
    <button role="tab" aria-selected="false">Perfil</button>
    <button role="tab" aria-selected="false">Configuración</button>
  </div>


  <div role="table" aria-label="Tabla de usuarios" style="border:1px solid #ccc; width:300px;">
    <div role="rowgroup">
      <div role="row" style="font-weight:bold; background:#f0f0f0;">
        <span role="columnheader">Nombre</span>
        <span role="columnheader">Edad</span>
      </div>
      <div role="row">
        <span role="cell">Ana</span>
        <span role="cell">25</span>
      </div>
      <div role="row">
        <span role="cell">Carlos</span>
        <span role="cell">30</span>
      </div>
    </div>
  </div>


  <div role="img" aria-label="Logo del sitio en forma de círculo azul" 
       style="width:100px; height:100px; border-radius:50%; background-color:blue;">
  </div>
</body>
</html>
